baseurl = "https://martantoine.github.io/"
languageCode = "en-us"
theme = "texify3"
title = "Antoine Martin's Blog"
enableRobotsTXT = true

[pagination]
  pagerSize = 10

[taxonomies]
  tags = "tags"
  categories = "categories"

[markup.goldmark.renderer]
  unsafe = true
[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    block = [['$$', '$$'], ['\[', '\]']]
    inline = [['$', '$'], ['\(', '\)']]
[markup.highlight]
  noClasses = false
[markup.tableOfContents]
  startLevel = 2
  endLevel = 6
  ordered = false

[params]
  title = "Antoine Martin's Blog"
  author = "Antoine Martin"
  description = "Antoine Martin's personal blog - robotics, embedded systems, and side projects."
  keywords = ["robotics", "embedded systems", "antoine martin"]
  dateFormat = "2 January 2006"
  emphasisWithDots = true
  toc = true
  showWordCount = true
  showReadingTime = true
  math = false
  enableDuckDuckGoSearchBox = true
  numberedSubtitles = true

  [params.commentEngine]
    code = ""

  [params.buymeacoffee]
    code = ""

[[menu.main]]
  name = "About"
  url = "/about/"
  weight = 1

[[menu.main]]
  name = "Blog"
  url = "/posts/"
  weight = 2

[[menu.main]]
  name = "GitHub"
  url = "https://github.com/martantoine"
  weight = 3

[[menu.main]]
  name = "LinkedIn"
  url = "https://www.linkedin.com/in/antoine-vincent-martin/"
  weight = 4

[[menu.main]]
  name = "RSS"
  url = "/index.xml"
  weight = 5
